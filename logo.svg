<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kreis -->
  <circle cx="50" cy="50" r="48" fill="#1d348a"/>
  
  <!-- Asterisk (6-strahlig, chunky) -->
  <g fill="#ffffff" transform="translate(50 50)">
    <!-- vertikaler Strahl -->
    <rect x="-6" y="-30" width="12" height="60" rx="3"/>
    <!-- 60° rotiert -->
    <rect x="-6" y="-30" width="12" height="60" rx="3" transform="rotate(60)"/>
    <!-- 120° rotiert -->
    <rect x="-6" y="-30" width="12" height="60" rx="3" transform="rotate(120)"/>
  </g>
</svg>